<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="description" content="Wedding Diary — Fine art photography for timeless memories. Capturing your special day with elegance and artistry." />
    <title>Wedding Diary</title>

    <!-- Fonts — swap to avoid blocking render on slow connections -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">

    <!-- Fallback for non-JS -->
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    </noscript>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="icon" type="image/png" href="/logo.png"/>

    <!-- GitHub Pages SPA redirect handler -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-sand text-ink">
    <!-- Instant skeleton so the page isn't completely blank while JS loads -->
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d0d0d">
        <div style="text-align:center">
          <div style="width:40px;height:40px;border:3px solid #333;border-top-color:#7296a2;border-radius:50%;animation:wdspin 0.8s linear infinite;margin:0 auto"></div>
          <p style="margin-top:16px;font-family:Inter,sans-serif;font-size:11px;letter-spacing:0.2em;color:#666">LOADING</p>
        </div>
      </div>
      <style>@keyframes wdspin{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
